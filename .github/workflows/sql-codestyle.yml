name: SQL Codestyle
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - data/**
      - "!README.md"
      - "!docs/**"

concurrency:
  # New commits on a PR cancel the still-running codestyle check on the old
  # commit. github.ref is refs/pull/<N>/merge, so the group is stable per PR.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    name: SQL
    if: ${{ !github.event.pull_request.draft }}
    env:
      CODESTYLE_REPORT_FILE: codestyle-report.md
    steps:
      - uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: AzerothCore codestyle
        run: python ./apps/codestyle/codestyle-sql.py
      - name: Save PR number
        if: always()
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt
      - name: Upload codestyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codestyle-report
          path: |
            codestyle-report.md
            pr-number.txt
          if-no-files-found: ignore
          retention-days: 1
